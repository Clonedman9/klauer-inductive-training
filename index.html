<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>比较之间 · 克劳尔归纳训练</title>
<style>
:root{--bg:#f4f5ef;--paper:#fffefb;--ink:#243b35;--muted:#708079;--line:#dde4db;--green:#245a49;--pale:#e9f0e6;--orange:#c86843;--soft:#fcf0e6;--red:#ac473d;--radius:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.43;cursor:not-allowed}
button,a,input,select,textarea{outline-offset:4px}
a{color:var(--green)}
button{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 17px;transition:background .16s,transform .16s}
button:hover:not(:disabled){background:var(--pale)}
button.primary{background:var(--green);border-color:var(--green);color:white}
button.primary:hover{background:#174633}
button.flat{border-color:transparent;background:transparent}
button.small{padding:6px 12px;font-size:13px}
button.danger{color:var(--red)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,4vw,46px);line-height:1.28;letter-spacing:-1px}
h2{font-size:25px;line-height:1.45}
h3{font-size:17px}
small,.muted{color:var(--muted)}
small{font-size:12px}
.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
.side{padding:32px 23px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:750}
.mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--green);border-radius:50%;font-size:22px;color:var(--green)}
.brand small{display:block;letter-spacing:2px;font-size:10px;font-weight:500}
.nav{display:grid;gap:8px}
.nav button{border:none;background:transparent;text-align:left;padding:12px 15px;color:var(--muted)}
.nav button.active{background:var(--green);color:white}
.nav span{display:inline-block;width:24px}
.sidefoot{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sidefoot b{color:var(--green)}
.main{padding:32px 38px 50px;max-width:1400px;width:100%;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:750}
.topright,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:36px;display:grid;grid-template-columns:1.25fr 1fr;gap:30px;position:relative;overflow:hidden}
.hero p{max-width:510px;color:var(--muted);margin:19px 0 25px}
.hero em{color:var(--orange);font-style:normal}
.diagram{background:#eef2e9;border-radius:18px;display:grid;place-items:center;padding:22px;min-width:0}
.diagram svg{width:100%;max-width:330px;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:20px}
.stat{background:var(--paper);padding:18px 23px}
.stat b{font-size:28px;font-weight:650;margin-right:9px}
.sectiontitle{margin:29px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.coursegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.course{padding:17px;text-align:left;min-height:170px;position:relative;display:flex;flex-direction:column;align-items:flex-start}
.course:hover{transform:translateY(-3px)}
.course.current{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.course .num{font-size:26px;font-family:Georgia,serif;color:var(--muted)}
.course h3{font-size:14px;margin:10px 0 4px;line-height:1.5}
.course small{margin-top:auto}
.badge{font-size:11px;border-radius:20px;padding:3px 9px;display:inline-block;background:var(--pale);color:var(--green)}
.badge.orange{background:var(--soft);color:var(--orange)}
.progress{height:5px;border-radius:10px;background:#e5e9e1;overflow:hidden}
.progress i{height:100%;display:block;background:var(--green);border-radius:10px}
.course .progress{width:100%;margin-top:10px}
.notice{border:1px solid #eadfcf;background:#fbf5eb;border-radius:13px;padding:14px 17px;font-size:13px;color:#7d674d;margin-top:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:25px}
.stack{display:grid;gap:18px}
.training{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px}
.qtitle{margin:12px 0 22px;font-size:22px;line-height:1.6}
.stimuli{display:flex;gap:11px;flex-wrap:wrap;align-items:center;justify-content:center;padding:22px 10px;background:#f7f8f3;border:1px solid #e5e9df;border-radius:15px;margin-bottom:21px}
.token{display:inline-flex;align-items:center;justify-content:center;min-width:61px;min-height:58px;max-width:100%;padding:8px 12px;background:white;border:1px solid var(--line);border-radius:12px;text-align:center;word-break:break-word;vertical-align:middle}
.token svg{width:78px;height:66px;max-width:100%;flex-shrink:0}
.seqitem{display:flex;align-items:center;gap:8px;flex-direction:column}
.seqitem small{font-size:11px}
.seqarr{color:#9ca79b;font-size:19px}
.matrixwrap{overflow-x:auto;width:100%}
.matrix{border-collapse:separate;border-spacing:8px;margin:auto;text-align:center;max-width:100%}
.matrix th{font-size:12px;font-weight:500;color:var(--muted);padding:4px}
.matrix td{min-width:68px}
.matrix .token{width:100%;min-height:62px}
.matrix .blank{border:1px dashed var(--green);color:var(--green);background:var(--pale);font-size:24px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.option{padding:12px 15px;display:flex;align-items:center;gap:11px;text-align:left;min-height:65px;min-width:0}
.option .letter{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--line);border-radius:50%;font-size:11px;flex-shrink:0}
.option.selected{border-color:var(--green);background:var(--pale);box-shadow:inset 0 0 0 1px var(--green)}
.option.correct{border-color:var(--green);background:#eaf3e9}
.option.wrong{border-color:#d49083;background:#fbeee8}
.option .token{border:none;background:transparent;padding:0;min-height:35px}
.option .token svg{width:66px;height:57px}
.qfoot{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:23px}
.feedback{padding:17px 20px;border-radius:13px;margin-top:18px;background:var(--pale);border-left:3px solid var(--green)}
.feedback p{font-size:14px;margin-top:7px}
.feedback.bad{background:#fbf0e8;border-color:var(--orange)}
.feedback .check{margin-top:12px;padding-top:11px;border-top:1px solid #ccd9c8}
.hint{margin:14px 0 0;background:var(--soft);padding:13px 16px;border-radius:12px;font-size:14px}
.strategy{background:#f5f7f1;border:1px solid var(--line);padding:17px;border-radius:14px;margin-top:20px}
.strategy label{display:block;margin:10px 0 6px;font-size:13px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,select,textarea{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:66px;line-height:1.6;font-size:13px}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:15px 0}
.dots button{padding:6px 0;font-size:12px;border-radius:9px}
.dots button.done{background:var(--green);color:white}
.dots button.here{outline:2px solid var(--orange);outline-offset:2px}
.aside h3{margin-bottom:12px}
.aside p{font-size:13px;color:var(--muted);margin:10px 0}
.aside .card{padding:20px}
.steps{padding-left:22px;font-size:13px;color:var(--muted)}
.steps li{padding:4px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.widebutton{width:100%;margin-top:12px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.table{border-collapse:collapse;width:100%;font-size:13px}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{font-weight:600;color:var(--muted)}
.tablewrap{overflow-x:auto}
.source p{margin:12px 0}
.source li{margin-bottom:7px}
.source ul,.source ol{padding-left:23px}
.reviewbuckets{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.reviewbuckets button.active{background:var(--green);color:white}
.reviewgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.reviewcard{text-align:left;padding:15px;font-size:12px;position:relative}
.reviewcard.sorted{opacity:.6;border-color:var(--green);background:var(--pale)}
.reviewcard .mini{font-size:12px;color:var(--muted);margin:8px 0}
.reviewcard .stimuli{padding:6px;gap:4px;margin:8px 0}
.reviewcard .token{font-size:11px;min-height:33px;min-width:32px;padding:4px}
.reviewcard .token svg{width:39px;height:33px}
.reviewcard .matrix{border-spacing:3px;font-size:10px}
.reviewcard .matrix td{min-width:28px}
.reviewcard .matrix th{font-size:10px}
.reviewcard .seqarr{display:none}
.reviewcard .seqitem small{display:none}
.reviewcard .matrix .token{min-height:30px}
.recordbar{display:grid;grid-template-columns:95px 1fr 60px;align-items:center;gap:10px;margin:13px 0;font-size:13px}
.modal::backdrop{background:#17362b66;backdrop-filter:blur(3px)}
.modal{max-width:480px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:20px;padding:27px;color:var(--ink);background:var(--paper)}
.modal p{margin:13px 0 23px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263e35;color:white;padding:12px 22px;border-radius:13px;max-width:90%;z-index:20;font-size:13px;box-shadow:0 10px 30px #193b3522}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:30px}
.spacer{height:16px}
.overviewnote{font-size:13px;color:var(--muted);margin-top:12px}
.hidden{display:none!important}
@media(min-width:1500px){.main{padding:40px 55px}
}
@media(max-width:1150px){.main{padding:25px}
.coursegrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.training{grid-template-columns:minmax(0,1fr) 220px}
.hero{padding:28px}
.side{padding:28px 17px}
.shell{grid-template-columns:195px minmax(0,1fr)}
}
@media(max-width:850px){.shell{display:block}
.side{height:auto;position:static;padding:16px 20px;border-right:0;border-bottom:1px solid var(--line);gap:15px}
.brand{font-size:18px}
.brand small{display:none}
.nav{display:flex;overflow-x:auto;gap:4px}
.nav button{white-space:nowrap;padding:9px 13px;font-size:13px}
.nav span{display:none}
.sidefoot{display:none}
.main{padding:22px 18px}
.top{margin-bottom:20px}
.hero{grid-template-columns:1fr 220px;gap:15px;padding:24px}
.hero h1{font-size:31px}
.training{grid-template-columns:1fr}
.aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reviewgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){.hero{grid-template-columns:1fr}
.diagram{min-height:155px;padding:13px}
.diagram svg{height:152px}
.hero p{margin:14px 0 20px}
.coursegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.course{min-height:157px;padding:15px}
.stats .stat{padding:13px 10px}
.stat b{font-size:23px;display:block;line-height:1.3}
.stat{font-size:11px}
.top{align-items:flex-start}
.topright{gap:6px}
.topright small{font-size:10px}
.card{padding:19px}
.qtitle{font-size:19px}
.options{gap:8px}
.option{padding:10px 9px;font-size:13px}
.option .letter{width:21px;height:21px}
.option .token{min-width:0}
.token{min-width:44px;padding:7px}
.token svg{width:58px;height:53px}
.stimuli{gap:7px;padding:15px 7px}
.seqarr{display:none}
.aside,.split{grid-template-columns:1fr}
.matrix{border-spacing:4px}
.matrix td{min-width:45px}
.matrix .token{font-size:13px;min-height:49px}
.fields{grid-template-columns:1fr}
.reviewgrid{grid-template-columns:1fr 1fr;gap:8px}
.reviewcard{padding:10px}
.table{min-width:520px}
.eyebrow{font-size:9px;letter-spacing:1px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<dialog id="resetDialog" class="modal"><h2>重新开始训练？</h2><p>这会清除本网页保存在当前浏览器的作答、笔记和复盘记录。可先在训练记录中导出进度。</p><div class="row"><button id="cancelReset">保留记录</button><button id="confirmReset" class="danger">清除并重新开始</button></div></dialog>
<script>
'use strict';
const TYPES=[
{id:'G',name:'概括',en:'Generalization',branch:'a',op:'s',brief:'比较属性，寻找共同点',hint:'逐个比较对象的属性：形状、数量、颜色、含义或数的性质。哪些属性全部相同？'},
{id:'D',name:'辨别',en:'Discrimination',branch:'a',op:'d',brief:'比较属性，寻找差异',hint:'先找出多数对象共同的属性，再检验哪一个不符合。不要只凭外观熟悉程度。'},
{id:'C',name:'交叉分类',en:'Cross classification',branch:'a',op:'b',brief:'同时比较属性的相同与不同',hint:'分别看行标题和列标题。缺项必须同时满足两个分类条件。'},
{id:'R',name:'关系识别',en:'Recognizing relationships',branch:'r',op:'s',brief:'比较关系，寻找共同规律',hint:'比较相邻项或成对对象之间的变化。把同一个关系用于新的对象。'},
{id:'F',name:'关系区分',en:'Differentiating relationships',branch:'r',op:'d',brief:'比较关系，发现规律中断',hint:'逐段比较相邻项之间的关系，或各组中关系的方向。哪里没有遵守同一种关系？'},
{id:'S',name:'系统建构',en:'System construction',branch:'r',op:'b',brief:'同时比较关系的相同与不同',hint:'分别推断行方向和列方向的变化，再让候选答案接受两个方向的检验。'}
];
const TYPE=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const LESSONS=[
['先试着解决','熟悉材料与训练情境，先用自己的办法解决。','自然尝试',[2,2,2,2,2,2]],
['属性，还是关系','学习区分对象自身的属性与对象之间的关系；重新归类第 1 课题目。','分清对象',[2,2,2,2,2,2]],
['属性的三种比较','区分概括、辨别和交叉分类；给已遇到的属性题重新归类。','属性分支',[4,4,4,0,0,0]],
['关系的三种比较','区分关系识别、关系区分和系统建构，并回顾属性题。','关系分支',[0,0,0,4,4,4]],
['找到共同点，再检查','练习概括与关系识别的解题、反向检验；回顾题型分类。','相同',[6,0,0,6,0,0]],
['发现差异，再检查','练习辨别与关系区分的解题、反向检验；回顾题型分类。','不同',[0,6,0,0,6,0]],
['同时处理相同与不同','练习交叉分类与系统建构的解题、检验；回顾题型分类。','相同与不同',[0,0,6,0,0,6]],
['属性分支的完整练习','复习三种属性题，每道题实践识别、比较与检查三问。','属性巩固',[4,4,4,0,0,0]],
['关系分支的完整练习','复习三种关系题，每道题实践识别、比较与检查三问。','关系巩固',[0,0,0,4,4,4]],
['把策略带到新问题','混合练习六类题，自己识别任务、选择比较方法并检查。','混合巩固',[2,2,2,2,2,2]]
].map((a,i)=>({n:i+1,title:a[0],goal:a[1],tag:a[2],counts:a[3],items:[]}));
const COLORS=['#cf714d','#447ba1','#5d8660','#9e78a4'];
const COLORN=['橙色','蓝色','绿色','紫色'];
const SHAPEN={circle:'圆',square:'方块',triangle:'三角形',diamond:'菱形',star:'星形',arrow:'箭头'};
const f=(s='circle',c=0,n=1,fill=true,rot=0,size=1)=>({s,c,n,fill,rot,size});
const grid=(cells,rows,cols)=>({kind:'grid',cells,rows,cols});
const seq=items=>({kind:'seq',items});
const bank={};
function add(k,m,p,stem,opts,answer,why,check,multi=false){(bank[k]??=[]).push({k,m,p,stem,opts,answer:Array.isArray(answer)?answer:[answer],why,check,multi});}
function v(k,p,stem,opts,a,w,c,multi=false){add(k,'V',p,stem,opts,a,w,c,multi);}
function n(k,p,stem,opts,a,w,c){add(k,'N',p,stem,opts,a,w,c);}
function g(k,p,stem,opts,a,w,c,multi=false){add(k,'F',p,stem,opts,a,w,c,multi);}
// 所有题目均为本网页新编。六类题型与十课目标依据 Klauer & Phye (2008)。
v('G','选出能加入示例一组的词。',['苹果','梨','桃'],['葡萄','胡萝卜','白菜','土豆'],0,'示例按日常食物分类都属于水果，葡萄符合这一共同属性。','逐个检查：所选词与三个示例之间，是否存在“不是水果”的差异？');
v('G','哪些词可以与示例归为一组？请选择所有符合的词。',['麻雀','燕子'],['鸽子','蝙蝠','企鹅','蝴蝶'],[0,2],'示例是鸟类；鸽子、企鹅也是鸟类。会不会飞不是共同标准，蝙蝠是哺乳动物。','检查每个已选对象是否都是鸟类，再检查未选对象有没有遗漏的鸟类。',true);
v('G','下列词语的共同属性是什么？',['铜','铁','铝'],['都是金属','都能被磁铁吸引','都是液体','都是同一种颜色'],0,'三者都属于金属。颜色和磁性并不相同。','主动找反例：铜和铝不满足“都能被磁铁吸引”，但没有一个不是金属。');
v('G','选出可以扩充这个类别的项目。',['厘米','米','千米'],['分米','千克','秒','摄氏度'],0,'示例都是长度单位，分米也用于测量长度。','反向检查：所选项目测量的是否是质量、时间或温度？分米均不是。');
v('G','选出与示例共有同一种语言属性的词。',['奔跑','行走','跳跃'],['游泳','泳池','蓝色','安静'],0,'示例都表示动作；游泳也表示动作。','检查四个候选词，只有游泳与每个示例都共享“表示动作”。');
v('G','选出能加入示例一组的图形名称。',['三角形','正方形','五边形'],['六边形','圆','椭圆','弧线'],0,'示例都是由直线段围成的封闭平面图形，即多边形；六边形符合。','检查选项是否含曲线、是否封闭；六边形没有破坏共同定义。');
v('G','这些词共享什么性质？',['迅速','快速','飞快'],['意义都与速度快有关','都表示动作慢','都表示温度高','都是身体部位'],0,'三个词都描述较快的速度，表达强度可不同。','试着找一个与“慢”同义的示例：没有；三者都保留速度快的含义。');

function diagram(){return`<div class="diagram"><svg viewBox="0 0 330 220" aria-label="比较属性与关系的六类训练"><path d="M165 34V58M165 58H84V81M165 58H246V81" fill="none" stroke="#94ab91" stroke-width="1.2"/><text x="165" y="27" text-anchor="middle" fill="#245a49" font-size="15">比较，发现结构</text><rect x="18" y="82" width="132" height="41" rx="12" fill="#fffefb"/><rect x="180" y="82" width="132" height="41" rx="12" fill="#245a49"/><text x="84" y="108" text-anchor="middle" fill="#245a49" font-size="13">对象的属性</text><text x="246" y="108" text-anchor="middle" fill="white" font-size="13">对象之间的关系</text><path d="M84 124V151M246 124V151" stroke="#94ab91"/><text x="84" y="171" text-anchor="middle" fill="#627661" font-size="12">概括 · 辨别 · 交叉分类</text><text x="246" y="171" text-anchor="middle" fill="#627661" font-size="12">识别 · 区分 · 系统建构</text><text x="165" y="206" text-anchor="middle" fill="#c86843" font-size="12">找相同　/　找不同　/　同时比较</text></svg></div>`;}
function render(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="mark">∩</span><div>比较之间<small>THE COMPARISON LAB</small></div></div><nav class="nav" aria-label="主要导航">${[['home','01','课程总览'],['train','02','进入训练'],['review','03','分类复盘'],['records','04','训练记录'],['about','05','依据与说明']].map(([id,no,label])=>`<button data-nav="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><span>${no}</span>${label}</button>`).join('')}</nav><div class="sidefoot"><b>先比较，再作答。</b><p>把一次答案，变成一种方法。</p><div class="spacer"></div>基于 Klauer & Phye, 2008<br>方法结构复现 · 中文新编题</div></aside><main class="main"><header class="top"><div><div class="eyebrow">INDUCTIVE REASONING / 归纳思维</div><small>120 道题 · 10 堂课 · 六种比较方式</small></div><div class="topright"><small><span class="dot"></span><span id="storageStatus">${storageOK?'进度已保存在本浏览器':'当前环境无法保存，请导出进度'}</span></small><button class="small" id="saveHtml" title="保存后可在浏览器直接打开">保存离线网页</button></div></header><div id="page">${({home:home,train:train,review:review,records:records,about:about}[view])()}</div><div class="footer">比较之间 · 独立教学实现，非作者官方软件或原版 120 题题卡</div></main></div>`;bind();}
function home(){const done=doneCount(),first=all.filter(q=>answerFor(q.id).done&&answerFor(q.id).first).length;return`<section class="hero"><div><div class="eyebrow">A SMALL PRACTICE, A TRANSFERABLE STRATEGY</div><div class="spacer"></div><h1>看见不同问题里的<br><em>同一种结构。</em></h1><p>先观察，再比较；提出规则，再反过来检查。用十堂有顺序的练习，熟悉一种可以带到新问题里的思考方法。</p><div class="row"><button class="primary" id="continue">${done?'继续第 '+String(state.lesson).padStart(2,'0')+' 课':'从第 01 课开始'}　→</button><button id="openAbout">了解训练依据</button></div></div>${diagram()}</section><section class="stats" aria-label="训练概览"><div class="stat"><b>${done}<small> / 120</small></b>已完成题目</div><div class="stat"><b>${LESSONS.filter(lessonComplete).length}<small> / 10</small></b>已完成课程</div><div class="stat"><b>${done?Math.round(first/done*100)+'%':'—'}</b>已完成题首次答对率</div></section><div class="sectiontitle"><h2>十堂课，一步步比较</h2><span class="badge">每课 12 道新题</span></div><div class="coursegrid">${LESSONS.map(l=>{const d=countLesson(l),fin=lessonComplete(l);return`<button class="course ${state.lesson===l.n?'current':''}" data-lesson="${l.n}"><div class="row between" style="width:100%"><span class="num">${String(l.n).padStart(2,'0')}</span>${fin?'<span class="badge">完成 ✓</span>':d===12?'<span class="badge orange">待归类复盘</span>':''}</div><h3>${esc(l.title)}</h3><small>${esc(l.tag)} · ${d}/12</small><div class="progress"><i style="width:${d/12*100}%"></i></div></button>`;}).join('')}</div><p class="overviewnote">可点击任意课程查看；按 01 → 10 的顺序训练，才能逐步经历论文设计的教学目标。归类复盘回看旧题，不计入 120 道新题。</p><div class="notice">本页遵循论文公开的六类操作、题量、材料配额与十课教学目标；题目和逐题分配由本页新编。完整原版题卡尚未核实，因此这里不标称“作者原版题库”。</div>`;}
function strategy(q,a){if(state.lesson===1)return'';const lesson=state.lesson,required=lesson>=8,showOps=lesson>=3,showMethod=lesson>=5,ops=lesson===3&&TYPE[q.k].branch==='r'?[]:[['s','寻找相同'],['d','寻找不同'],['b','同时比较相同与不同']];return`<section class="strategy"><div class="row between"><h3>${required?'每题三问':lesson===2?'比较的是属性，还是关系':lesson<=4?'识别比较方式':'想一想，再比较'}</h3><small>${required?'完成文字记录后才能核对答案':'可记录，也可与陪练口头讨论'}</small></div><label for="branch">${showMethod?'① ':''}我需要比较什么？${required?' *':''}</label><div class="fields"><select id="branch"><option value="">选择：属性 / 关系</option><option value="a" ${a.ba==='a'?'selected':''}>对象的属性</option><option value="r" ${a.ba==='r'?'selected':''}>对象之间的关系</option></select>${showOps&&ops.length?`<select id="operation" aria-label="比较目标"><option value="">选择比较目标</option>${ops.map(([val,name])=>`<option value="${val}" ${a.op===val?'selected':''}>${name}</option>`).join('')}</select>`:''}</div>${showMethod?`<label for="note">② 我怎样比较，才能找出答案？${required?' *':''}</label><textarea id="note" maxlength="4000" placeholder="写出你准备比较的对象、规则或假设。">${esc(a.note||'')}</textarea><label for="verify">③ 我怎样用反向比较检查？${required?' *':''}</label><textarea id="verify" maxlength="4000" placeholder="寻找共同点后尝试找反例；发现不同后检查余项；关系变换可尝试逆向还原。">${esc(a.verify||'')}</textarea><small>文字按原样保存；网页不自动评判解释质量。核对时请与示例推理比较，可由陪练一起确认。</small>`:`<p class="overviewnote">${lesson===2?'属性是对象自身的特点；关系是两个或多个对象之间的联系。先学会区分它们，再到下一课细分比较方式。':lesson===3?'属性题可以寻找共同属性、辨别不合群项，或同时按两个属性交叉分类。':'关系题可以寻找一致的关系、发现被扰乱的关系，或同时比较两个方向的关系。'}</p>`}</section>`;}
function train(){const l=LESSONS[state.lesson-1],q=currentQ(),a=answerFor(q.id),order=optionOrder(q),isDone=a.done;selected=isDone?(a.choice||[]):selected;return`<div class="row between" style="margin-bottom:19px"><div><span class="eyebrow">LESSON ${String(l.n).padStart(2,'0')} / 10</span><h2>${esc(l.title)}</h2></div><select id="lessonSelect" aria-label="切换课程" style="width:auto;max-width:180px">${LESSONS.map(x=>`<option value="${x.n}" ${x.n===l.n?'selected':''}>第 ${x.n} 课 · ${esc(x.tag)}</option>`).join('')}</select></div><div class="training"><section class="card" id="questionCard"><div class="row between"><span class="badge">${q.m==='V'?'语言材料':q.m==='F'?'图形材料':'数量材料'}</span><small>本课 ${state.index+1} / 12 · 题号 ${q.id}</small></div><h2 class="qtitle" tabindex="-1" id="qtitle">${esc(q.p)}</h2>${stimulus(q.stem)}<div class="row between" style="margin-bottom:10px"><small>${q.multi?'多选 · 选择所有符合的答案':'单选 · 选择一个答案'}</small><small>可用数字键选择</small></div><div class="options" role="group" aria-label="答案选项">${order.map((i,pos)=>`<button class="option ${selected.includes(i)?'selected':''} ${isDone&&q.answer.includes(i)?'correct':''}" data-option="${i}" aria-pressed="${selected.includes(i)}" ${isDone?'disabled':''}><span class="letter">${String.fromCharCode(65+pos)}</span>${token(q.opts[i])}</button>`).join('')}</div>${strategy(q,a)}<div id="hints">${hintHTML(q)}</div><div id="feedback" aria-live="polite">${isDone?successHTML(q,a):feedbackHTML(q)}</div><div class="qfoot"><button id="hint" class="flat small" ${isDone?'disabled':''}>给我一个提示${hintLevel?'（'+hintLevel+'/3）':''}</button><div class="row">${isDone?'<button class="small" id="revise">重新作答</button><button class="primary" id="next">'+(state.index===11?'查看本课完成情况':'下一题　→')+'</button>':`<button class="small" id="reveal">查看讲解</button><button class="primary" id="submit">核对答案　→</button>`}</div></div></section><aside class="aside"><div class="card"><h3>这堂课练什么</h3><p>${esc(l.goal)}</p><div class="progress"><i style="width:${countLesson(l)/12*100}%"></i></div><div class="dots">${l.items.map((id,i)=>`<button data-jump="${i}" class="${answerFor(id).done?'done':''} ${state.index===i?'here':''}" aria-label="第 ${i+1} 题${answerFor(id).done?'，已完成':''}">${i+1}</button>`).join('')}</div><small>完成 ${countLesson(l)}/12 · ${reviewRequired(l.n)?'含分类复盘目标':'巩固与练习'}</small><button class="small widebutton" id="lessonReview">本课归类复盘</button></div><div class="card"><span class="eyebrow">A COMPARISON ROUTINE</span><h3 style="margin-top:8px">${l.n===1?'先用自己的办法':'把过程说出来'}</h3>${l.n===1?'<p>先观察材料，按自己的想法解决。可以说说理由，也可以请陪练追问你是怎样想到的。这一课先熟悉题目。</p>':l.n<=4?'<ol class="steps"><li>确定是在比较属性还是关系。</li><li>观察题目里稳定的共同点或差异。</li><li>说说你为什么选择这个答案。</li></ol>':'<ol class="steps"><li>确定要比较的对象。</li><li>找相同、不同，或两者。</li><li>提出一个解释全部材料的规则。</li><li>反过来检查，有没有反例。</li></ol>'}<p>答错时可以继续尝试。提示和查看讲解都会记录，不会改写首次作答。</p><small>原方案通常由训练者引导；可请家长、教师或同伴一起讨论。</small></div></aside></div>`;}
function hintHTML(q){if(!hintLevel)return'';const hints=['先把所有材料逐个看完，尝试只改变一个比较角度。',TYPE[q.k].hint,'试用这条规则，再自己验证：'+q.why];return hints.slice(0,hintLevel).map((x,i)=>`<div class="hint"><b>提示 ${i+1}</b>　${esc(x)}</div>`).join('');}
function feedbackHTML(q){if(!feedback)return'';if(feedback==='wrong')return`<div class="feedback bad"><b>这个选择还不能解释全部材料。</b><p>${esc(hintLevel>=2?TYPE[q.k].hint:'把所选答案放回题目，逐项检查它与已知材料是否一致。')} 你可以调整后再次核对。</p></div>`;if(feedback==='class')return'<div class="feedback bad"><b>答案选择符合，但比较方式还需再看一眼。</b><p>重新区分对象的属性与对象之间的关系，再判断需要找相同、不同还是两者。</p></div>';if(feedback==='reveal')return`<div class="feedback bad"><b>先看讲解，再独立重做</b><p>${esc(q.why)}</p><p class="check"><b>检查思路：</b>${esc(q.check)}</p><small>看过讲解已记录。请完成自己的比较记录并选择答案；此题不计为独立首次答对。</small></div>`;return`<div class="feedback bad">${esc(feedback)}</div>`;}
function successHTML(q,a){const lesson=state.lesson,type=TYPE[q.k],showType=lesson>=4||(lesson===3&&type.branch==='a');return`<div class="feedback"><b>${lesson===1?'这个答案符合材料。说说你是怎样想到的。':'答案一致。接着检查你是怎样想到的。'}</b><p>${esc(q.why)}</p>${lesson>=5?`<p class="check"><b>反向比较与复查：</b>${esc(q.check)}</p>`:''}${lesson>=2?`<p><span class="badge">${showType?type.name:branchName(type.branch)}</span>　${showType?esc(type.brief):'比较'+branchName(type.branch)}</p>`:''}${lesson>=5?`<label style="display:flex;align-items:flex-start;gap:9px;font-size:13px;margin-top:12px"><input id="checked" type="checkbox" style="width:auto;margin-top:6px" ${a.checked?'checked':''}>我已对照示例，检查自己的规则与复查过程。</label>`:''}</div>`;}
function capture(){const q=currentQ(),old=answerFor(q.id);state.answers[q.id]={...old,choice:[...selected],ba:document.getElementById('branch')?.value??old.ba??'',op:document.getElementById('operation')?.value??old.op??'',note:document.getElementById('note')?.value??old.note??'',verify:document.getElementById('verify')?.value??old.verify??''};save();}
function submit(){capture();const q=currentQ(),a=answerFor(q.id);if(!selected.length){toast('先选择一个答案。');return;}if(state.lesson>=8&&(!a.ba||!a.op||(a.note||'').trim().length<2||(a.verify||'').trim().length<2)){feedback='最后三课需要完成每题三问：选择比较对象和目标，并写下比较方法、复查方法。';render();return;}const right=selected.length===q.answer.length&&selected.every(i=>q.answer.includes(i));const classify=state.lesson<8||(a.ba===TYPE[q.k].branch&&a.op===TYPE[q.k].op);const attempts=(a.attempts||0)+1;state.answers[q.id]={...a,attempts,first:attempts===1?right&&classify&&!a.seen&&!(a.hints>0):a.first,choice:[...selected],hints:Math.max(a.hints||0,hintLevel),done:right&&classify,time:Date.now(),checked:false};feedback=right?(classify?null:'class'):'wrong';save();render();}
function next(){capture();const q=currentQ(),a=answerFor(q.id);if(state.lesson>=5&&!a.checked){toast('请先对照讲解与反向检查，勾选确认。');return;}if(state.index<11){state.index++;resetTransient();save();render();document.getElementById('qtitle')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else{go('review');}}
function review(){const l=state.lesson,ids=reviewIds(l),req=reviewRequired(l),r=state.reviews[l]||{},sorted=ids.filter(id=>r[id]).length,two=l===2;const buckets=two?[{id:'a',name:'属性题'},{id:'r',name:'关系题'}]:TYPES.filter(t=>l===3||l===8?t.branch==='a':l===9?t.branch==='r':true);if(!buckets.some(b=>b.id===reviewBucket))reviewBucket=buckets[0]?.id||'a';const display=reviewFilter==='todo'?ids.filter(id=>!r[id]):ids;const complete=countLesson(LESSONS[l-1])===12&&reviewComplete(l);return`<div class="row between"><div><div class="eyebrow">REVISIT & CLASSIFY / 第 ${l} 课</div><h2>回看旧题，识别比较方法</h2></div><select id="reviewLesson" style="width:auto" aria-label="选择复盘课程">${LESSONS.map(x=>`<option value="${x.n}" ${x.n===l?'selected':''}>第 ${x.n} 课</option>`).join('')}</select></div><div class="notice">${l===1?'第1课以自然尝试为主，不要求学习题型术语。这里可选做归类；完成新题后可直接进入第2课。':l===2?'依据论文第2课目标，重新区分第1课题目是在比较属性还是关系。':l===3?'依据第3课目标，把目前已遇到的属性题分为三类。':l===4?'依据第4课目标，归类已遇到的关系题，同时回顾属性题。':l<=7?'依据本课目标，再次练习把已遇到的题与六种比较方式对应。':'最后三课在每道新题中完成识别、比较、检查三问；本页的归类复盘可选做。'} 本页仅回看你已经完成的新题。</div><div class="card" style="margin-top:18px"><div class="row between"><div><h3>先选择一个分类，再点击属于它的题卡</h3><small>已归类 ${sorted} / ${ids.length} · ${req?'本课教学目标的一部分':'可选复盘'}</small></div><select id="reviewFilter" style="width:auto" aria-label="筛选题卡"><option value="all" ${reviewFilter==='all'?'selected':''}>显示全部</option><option value="todo" ${reviewFilter==='todo'?'selected':''}>只看未归类</option></select></div><div class="reviewbuckets">${buckets.map(b=>`<button class="small ${reviewBucket===b.id?'active':''}" data-bucket="${b.id}">${esc(b.name)}</button>`).join('')}</div><div class="reviewgrid">${display.map(id=>{const q=Q[id];return`<button class="reviewcard ${r[id]?'sorted':''}" data-sort="${id}" ${r[id]?'disabled':''}><span class="badge">${id} · 第 ${q.lesson} 课</span><div class="mini">${esc(q.p)}</div>${stimulus(q.stem)}<b>${r[id]?'已正确归类 ✓':'放入「'+esc(buckets.find(b=>b.id===reviewBucket)?.name||'')+'」'}</b></button>`;}).join('')}</div>${!ids.length?'<div class="empty">先进入本课训练。完成的题目会出现在这里。</div>':!display.length?'<div class="empty">这一轮全部归类完成。</div>':''}<div class="qfoot"><button id="backTrain">返回本课题目</button>${complete?`<button class="primary" id="nextLesson">${l<10?'本课完成 · 进入第 '+(l+1)+' 课':'十课完成 · 查看训练记录'}　→</button>`:`<small>${countLesson(LESSONS[l-1])<12?'还需完成本课新题。':'完成分类后即可结束本课。'}</small>`}</div></div>`;}

function records(){const done=doneCount(),attempted=all.filter(q=>(answerFor(q.id).attempts||0)>0),independent=all.filter(q=>answerFor(q.id).done&&answerFor(q.id).first).length,checked=all.filter(q=>answerFor(q.id).done&&answerFor(q.id).checked).length;return`<div class="row between"><div><div class="eyebrow">YOUR PRACTICE / 练习轨迹</div><h2>记录方法，也记录进步</h2></div><div class="row"><button class="small" id="export">导出进度</button><button class="small" id="import">导入进度</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div></div><div class="stats"><div class="stat"><b>${done}/120</b>已完成</div><div class="stat"><b>${independent}</b>独立首次答对</div><div class="stat"><b>${checked}</b>已确认复查</div></div><div class="split" style="margin-top:20px"><div class="card"><h3>六种比较方式</h3>${TYPES.map(t=>{const d=bank[t.id].filter(q=>answerFor(q.id).done).length;return`<div class="recordbar"><span>${t.name}</span><div class="progress"><i style="width:${d*5}%"></i></div><small>${d}/20</small></div>`;}).join('')}</div><div class="card"><h3>你的练习设置</h3><label for="learner"><small>学习者名称（选填，仅保存在当前浏览器）</small></label><input id="learner" maxlength="40" value="${esc(state.name)}" placeholder="输入姓名或昵称"><p class="overviewnote">可个人练习，也可请教师、家长或同伴陪练。论文原方案依靠训练者的提问、提示和讨论；网页的提示是对此的有限替代。</p><p class="overviewnote">已核对 ${attempted.length} 题。首次答对只统计没有提示或讲解帮助、并一次通过核对的题；重做不会改写首次记录。</p><button class="danger small" style="margin-top:15px" id="reset">清除本浏览器记录</button></div></div><div class="sectiontitle"><h3>作答与解释</h3><small>点击题号回到该题</small></div><div class="card tablewrap"><table class="table"><thead><tr><th>题目</th><th>比较方式</th><th>作答状态</th><th>我的比较方法 / 复查方法</th></tr></thead><tbody>${all.filter(q=>state.answers[q.id]).sort((a,b)=>a.lesson-b.lesson||LESSONS[a.lesson-1].items.indexOf(a.id)-LESSONS[b.lesson-1].items.indexOf(b.id)).map(q=>{const a=answerFor(q.id);return`<tr><td><button class="flat small" data-openq="${q.id}">${q.id}</button><br><small>第 ${q.lesson} 课</small></td><td>${TYPE[q.k].name}</td><td>${a.done?'完成':'进行中'}<br><small>${a.attempts||0}次核对 · ${a.hints||0}级提示${a.seen?' · 看过讲解':''}</small></td><td>${esc(a.note||'尚无文字记录')}<br><small>${esc(a.verify||'尚无复查记录')}</small></td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">完成第一题后，这里会出现你的记录。</td></tr>'}</tbody></table></div><div class="notice">这里只呈现本套新编练习的完成情况，不能据此推算智商、诊断认知能力或证明学习迁移。论文中原方案的研究效果不能直接用于本网页。</div>`;}
function about(){return`<div class="eyebrow">METHOD & PROVENANCE / 可核查的依据</div><h2>忠实落实公开方法，明确标注新编材料</h2><div class="stack source" style="margin-top:22px"><section class="card"><h3>作者与原始文献</h3><p>你上传的《学习迁移：为什么我们学到的往往比教给我们的更多》作者为 <b>卡尔·约瑟夫·克劳尔（Karl Josef Klauer）</b>。电子书扉页及作者简介均可核实；原书版权页标注2011年第一版。</p><p>本页主要依据：Klauer, K. J., & Phye, G. D. (2008). <i>Inductive Reasoning: A Training Approach.</i> Review of Educational Research, 78(1), 85–123. DOI: 10.3102/0034654307313402。</p><div class="row"><a href="https://journals.sagepub.com/doi/10.3102/0034654307313402" target="_blank" rel="noopener noreferrer">论文及表1、表2 ↗</a><a href="https://www.researchgate.net/publication/242148990_Inductive_Reasoning_A_Training_Approach" target="_blank" rel="noopener noreferrer">论文全文入口 ↗</a><a href="https://eric.ed.gov/?id=EJ787070" target="_blank" rel="noopener noreferrer">ERIC 文献记录 ↗</a></div></section><section class="card"><h3>本页保留了哪些设计</h3><ul><li><b>120道新题，六类各20题：</b>对应论文 Training Format（第91–92页），三问与反向检查见第92–93页。</li><li><b>语言、图形、数量材料各40题：</b>采用论文 Program II / III 的材料配额。不是面向不识字儿童、主要非言语的 Program I。</li><li><b>10堂课，每课12道新题：</b>教学目标依表2逐课实现；不把10课简化为同样的题型随机刷题。</li><li><b>区分属性与关系：</b>再分别练习寻找相同、不同、同时找两者，形成表1中的六类认知操作。</li><li><b>复盘旧题的类别：</b>第2课回看第1课，第3课归类属性题，第4课归类关系题并回顾属性，第5–7课继续归类复习。回看不增加新题数。</li><li><b>第8–10课每题三问：</b>要比较什么、如何比较、如何检验；保留文字记录，并用反向比较检查。原论文强调的是自我调控，不是单纯追求选对。</li></ul></section><section class="card tablewrap"><h3>六类认知操作 · 对应论文表1</h3><table class="table"><thead><tr><th>操作</th><th>比较对象</th><th>比较目标</th><th>题目形式</th></tr></thead><tbody>${TYPES.map((t,i)=>`<tr><td>${t.name}<br><small>${t.en}</small></td><td>${branchName(t.branch)}</td><td>${opName(t.op)}</td><td>${['成组、扩充类别、发现共同属性','辨别不合群的对象','四格、六格、九格的双属性分类表','续列、排序、类比','发现被扰乱的序列或关系','同时检验行列关系的矩阵'][i]}</td></tr>`).join('')}</tbody></table></section><section class="card tablewrap"><h3>十堂课目标 · 对应论文表2</h3><table class="table"><thead><tr><th>课程</th><th>教学目标</th><th>本页新题配额</th></tr></thead><tbody>${LESSONS.map(l=>`<tr><td>${l.n} · ${l.title}</td><td>${l.goal}</td><td>${l.counts.map((c,i)=>c?TYPES[i].name+'×'+c:'').filter(Boolean).join('、')}</td></tr>`).join('')}</tbody></table><p><small>表2规定教学目标，并未公开原版逐题顺序。上列每课的六类题量是本页为同时满足每课12题、每类20题而作的实现分配，不能称为作者原始逐题编排。</small></p></section><section class="card"><h3>补充核实：原版样题、训练周期与版本差异</h3><p><b>已公开的原版样例：</b>Klauer、Willmes 与 Phye（2002）的论文附录在印刷第21–23页给出了六类训练的六道样题。它们可以用来核对认知操作的含义，但没有提供完整120题及其原始题号与课次对应。本页没有把这些图示重新绘制成所谓原题，全部练习仍为中文新编题。</p><p><b>有文献依据的训练周期：</b>2002年该项实验持续五周，每周两次，每次最多45分钟，共十次训练，由有经验的心理学家带领约3–5人小组。可以参考这一周期安排练习；该时长属于特定实验条件，不能视为所有版本统一的课堂长度。</p><p><b>版本边界：</b>本页的十课教学目标与语言、图形、数量各40题的配额采用2008年论文对 Program II / III 的说明。作者1990年介绍的早期低龄儿童方案为12课×10题；它和本页采用的10课×12题结构需要区分。</p><p><b>本项目的实现选择：</b>每课各题型的配额、具体题序、三级提示、重试方式、讲解出现时机、必填文字与复查勾选，均为本网页设计。论文提供了引导比较、三问和反向检查的依据，但没有公开本页这些具体交互规则。这里也没有把提示撤除时机标为作者原版的渐隐程序。</p><div class="row"><a href="https://gwern.net/doc/dual-n-back/2002-klauer.pdf#page=8" target="_blank" rel="noopener noreferrer">2002年研究：训练安排，第8页 ↗</a><a href="https://gwern.net/doc/dual-n-back/2002-klauer.pdf#page=21" target="_blank" rel="noopener noreferrer">六类原版样题，附录第21–23页 ↗</a><a href="https://www.pedocs.de/volltexte/2010/840/pdf/Klauer_Denktraining_Schulanfaenger_1990_W_D_A.pdf" target="_blank" rel="noopener noreferrer">1990年早期低龄方案，第152页 ↗</a></div></section><section class="card"><h3>使用方式与复现范围</h3><p>建议按课程顺序，留出足够时间让学习者解释规则。原方案适用于一对一或小组引导。本页不强制计时，不设限时失败；是否分段完成可由陪练按学习者情况安排。</p><p>先独立尝试，遇到困难逐级使用提示；核对后阅读推理与反向检验，再确认自己的解释。最后三课要求实际记录三问，网页仅检查题目答案与题型分类，不自动判断文字解释是否合理。</p><p><b>题库边界：</b>本页120题均为新编；未取得并逐题核对1989、1991、1993年原训练手册的完整题卡，不属于官方软件或原版题库复刻。本页也未进行独立效果验证。</p><p><b>离线与隐私：</b>页面不调用网络接口，不加载外部图片、字体或脚本。保存为HTML后用浏览器直接打开即可。进度使用当前浏览器本地存储；隐私模式、预览环境或文件位置变化可能影响保存，请按需导出JSON进度备份。</p><button id="saveHtmlAbout" class="primary">保存这份离线 HTML 网页</button></section></div>`;}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function saveHtml(){captureIfTrain();const copy=document.documentElement.cloneNode(true);copy.querySelector('#app').innerHTML='';const toastEl=copy.querySelector('#toast');toastEl.textContent='';toastEl.classList.add('hidden');copy.querySelector('#resetDialog').removeAttribute('open');download('比较之间-克劳尔归纳训练.html','<!DOCTYPE html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('已请求保存网页。用浏览器打开 HTML 即可离线使用。');}
function exportProgress(){captureIfTrain();download('比较之间-训练进度-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');}
function captureIfTrain(){if(view==='train')capture();}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{captureIfTrain();go(b.dataset.nav);});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>startLesson(+b.dataset.lesson));const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};on('saveHtml',saveHtml);on('saveHtmlAbout',saveHtml);on('continue',()=>startLesson(state.lesson,state.index));on('openAbout',()=>go('about'));on('submit',submit);on('next',next);on('hint',()=>{capture();hintLevel=Math.min(3,hintLevel+1);const q=currentQ();state.answers[q.id]={...answerFor(q.id),hints:Math.max(answerFor(q.id).hints||0,hintLevel)};save();render();});on('reveal',()=>{capture();const q=currentQ();state.answers[q.id]={...answerFor(q.id),seen:true};feedback='reveal';save();render();});on('revise',()=>{capture();const q=currentQ();state.answers[q.id]={...answerFor(q.id),done:false,checked:false};resetTransient();save();render();});on('lessonReview',()=>{capture();go('review');});on('backTrain',()=>go('train'));on('nextLesson',()=>{if(state.lesson<10)startLesson(state.lesson+1);else go('records');});on('export',exportProgress);on('import',()=>document.getElementById('importFile').click());on('reset',()=>document.getElementById('resetDialog').showModal());document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{const q=currentQ(),i=+b.dataset.option;selected=q.multi?(selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]):[i];document.querySelectorAll('[data-option]').forEach(x=>{const on=selected.includes(+x.dataset.option);x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on));});if(feedback==='wrong'){feedback=null;document.getElementById('feedback').innerHTML='';}capture();});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{capture();state.index=+b.dataset.jump;resetTransient();save();render();});document.querySelectorAll('[data-bucket]').forEach(b=>b.onclick=()=>{reviewBucket=b.dataset.bucket;render();});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>sortCard(b.dataset.sort));document.querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>{const q=Q[b.dataset.openq];startLesson(q.lesson,LESSONS[q.lesson-1].items.indexOf(q.id));});const ls=document.getElementById('lessonSelect');if(ls)ls.onchange=()=>{capture();startLesson(+ls.value);};const rl=document.getElementById('reviewLesson');if(rl)rl.onchange=()=>{state.lesson=+rl.value;state.index=0;save();render();};const rf=document.getElementById('reviewFilter');if(rf)rf.onchange=()=>{reviewFilter=rf.value;render();};['branch','operation','note','verify'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=capture;});const ck=document.getElementById('checked');if(ck)ck.onchange=()=>{const q=currentQ();state.answers[q.id]={...answerFor(q.id),checked:ck.checked};save();};const learner=document.getElementById('learner');if(learner)learner.oninput=()=>{state.name=learner.value;save();};const file=document.getElementById('importFile');if(file)file.onchange=async()=>{if(!file.files[0])return;try{if(file.files[0].size>3000000)throw Error('文件过大');const parsed=validate(JSON.parse(await file.files[0].text()));state=parsed;save();resetTransient();render();toast('训练进度已导入。');}catch(e){toast('无法导入：'+e.message);}};}
document.getElementById('cancelReset').onclick=()=>document.getElementById('resetDialog').close();
document.getElementById('confirmReset').onclick=()=>{state=initial();resetTransient();save();document.getElementById('resetDialog').close();go('home');};
document.addEventListener('keydown',e=>{if(view!=='train'||e.ctrlKey||e.metaKey||e.altKey||document.getElementById('resetDialog').open)return;if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;const q=currentQ();if(/^[1-6]$/.test(e.key)&&!answerFor(q.id).done){document.querySelectorAll('[data-option]')[+e.key-1]?.click();e.preventDefault();}if(e.key==='Enter'){document.getElementById(answerFor(q.id).done?'next':'submit')?.click();e.preventDefault();}});
window.addEventListener('beforeunload',captureIfTrain);
// 导出网页时可连同题库结构自检；此处不包含任何测试分数或智商推算。
function auditBank(){return{total:all.length,classes:Object.fromEntries(TYPES.map(t=>[t.id,all.filter(q=>q.k===t.id).length])),materials:Object.fromEntries(MODES.map(m=>[m,all.filter(q=>q.m===m).length])),lessons:LESSONS.map(l=>l.items.length),unique:new Set(all.map(q=>q.id)).size,invalid:all.filter(q=>!q.answer.length||q.answer.some(i=>i<0||i>=q.opts.length)||(!q.multi&&q.answer.length!==1)).map(q=>q.id)};}
render();
</script>
