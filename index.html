  function about() {
    return `<div class="eyebrow">DESIGN EVIDENCE · VERSION ${E.VERSION}</div><h2>从认知操作出发设计题目</h2><div class="stack source" style="margin-top:20px"><section class="card"><h3>本次实际改变了什么</h3><ul><li>去掉题干中“按奇偶性”“蓝色且空心”等提前透露规则的说法。对象特点直接可见，由学习者比较并发现共同点。</li><li>20道交叉分类全部使用无分类标题的参照表格。新卡片保留两个分类维度，同时改变一个无关特点，不能只凭外观完全相同来归位。</li><li>20道关系区分全部要求定位并选择替换对象；再把你的替换代回原序列，实际判断两侧关系是否一致。</li><li>120道主题各含一个不先显示答案的反向检查。先锁定解答，再检查，最后展示规则和证据；检查步骤不另算主题。</li><li>三问可写可口述，不按字数、不按是否报出类别名称决定通过。结构化解答与查验均正确才能完成该题。</li><li>支持按需展开：先整体提出假设，有困难再逐项比较；三级提示只帮助选择比较步骤，不提前给出标准规则；使用情况仍单独记录。</li></ul></section><section class="card tablewrap"><h3>六类任务对应的原文与实际操作</h3><table class="table"><thead><tr><th>过程</th><th>实际完成的工作</th><th>验收</th></tr></thead><tbody>${E.TYPES.map((t, i) => `<tr><td>${t.name}<br><small>${esc(t.source)}</small></td><td>${['从对象中组成类别或扩充从示例发现的类别', '找出破坏其他对象共同属性的异项', '发现两个交叉分类维度，再归位新对象', '发现并应用统一变换／续列／类比', '找异常位置并选择替换对象，实际修复序列', '让缺项同时满足矩阵横向和纵向的关系'][i]}</td><td>${['限定可见维度中，共同属性与正确组唯一', '去掉异项后其余对象形成一致类别', '无行列类别标签；两维交叉；无关属性变化', '所有已知关系一致；用新对象作逆向还原', '修复后前后相邻关系均成立', '单看横向或纵向各有两个候选，联合后唯一；查验同样需要两条证据'][i]}</td></tr>`).join('')}</tbody></table></section><section class="card"><h3>主要原文依据</h3><p>Klauer & Phye（2008），<i>Inductive Reasoning: A Training Approach</i>：第87—88页定义与表1；第89—90页及图3的整体假设、定向验证与分析策略；第91页版本、题量以及“不必报出题型名称”；第92—93页表2、每题三问与相反比较。</p><div class="row"><a href="https://journals.sagepub.com/doi/10.3102/0034654307313402" target="_blank" rel="noopener noreferrer">2008论文正式出版页 ↗</a><a href="https://www.researchgate.net/publication/242148990_Inductive_Reasoning_A_Training_Approach" target="_blank" rel="noopener noreferrer">作者上传全文 ↗</a></div><p>Klauer、Willmes & Phye（2002）附录第21—23页公开六类样题。第22页关系区分要求找错并修正；第23页提供不预写分类名称的交叉分类样例及系统建构矩阵。它们来自1994儿童版，用于核对机制，不冒充已取得II／III完整题库。</p><a href="https://gwern.net/doc/dual-n-back/2002-klauer.pdf#page=21" target="_blank" rel="noopener noreferrer">六类原始样题，附录第21—23页 ↗</a></section><section class="card tablewrap"><h3>十课目标与本项目题型配额</h3><table class="table"><thead><tr><th>课次</th><th>表2对应目标</th><th>本项目编排</th></tr></thead><tbody>${E.LESSONS.map(l => `<tr><td>${l.n} · ${l.title}</td><td>${l.goal}</td><td>${l.counts.map((c, i) => c ? E.TYPES[i].name + '×' + c : '').filter(Boolean).join('，')}</td></tr>`).join('')}</tbody></table><p><small>原文表2规定的是教学目标。上列配额与逐题顺序为本项目编排，不是原版逐题分课表。</small></p></section><section class="card"><h3>题目构造与适用范围</h3><p>本版保留120道主题、六类各20、三种材料各40。文字资料使用画面直接给出的物品记录和字片变换，避免依靠鸟类分类或词义猜测；数量属性题使用可见的数字位值，关系题使用小整数及变换，系统建构的数对／字片分别承载两个方向的联系；图形题使用形状、颜色、数量、方向、大小和填充。</p><p>答案唯一性是在有限可见属性和本项目明确的变换模型中检验的。有限数列不可能排除所有人为数学规则；这里不宣称“在一切可能规则下唯一”。难度按材料和关系逐步加深，但未经过标准化校准。</p><p>把行列单独判断时各保留两个候选，是本项目为确保联合使用两条关系而增加的验收标准，不能称为原文规定的选项配额。关系题的逆向还原是本项目的具体检查任务；原文的相反比较还包括发现共同关系后寻找差异或反例，两者不应直接画等号。</p><p>原方案通常有训练者引导。2002年的一项实验是五周、每周两次、每次最多45分钟；这是特定研究条件。网页可用于个人或陪练，不自动复制原研究条件或效果。</p><p><b>原题边界：</b>这些是依据公开理论与样例机制构造的新题，不是作者商业题册原题的复制。题型细节、有限规则族、配额、提示时机、查验任务和交互方式均为本项目实现。本网站仍需独立教育效果评估。</p><p><b>数据：</b>本版记录独立保存，旧版进度不覆盖；没有账号、外部评分接口或运行时依赖。保存HTML可离线使用；预览或隐私环境请导出进度备份。</p><button class="primary" id="saveHtmlAbout">保存完整离线网页</button></section></div>`;

    const q = qCurrent(), a = record(q);
    if (!E.validCheck(q, a.check)) { notify('先选择你的查验结果。'); return; }
    const evidence = E.repairEvidence(q, a.final);
    if (evidence && evidence.edges.some((_, i) => typeof a.edgeJudgments?.[i] !== 'boolean')) { notify('先分别判断替换项两侧的关系是否一致。'); return; }
    const edgeCheckOK = !evidence || evidence.edges.every((edge, i) => edge.same === a.edgeJudgments[i]);
    if (evidence && a.firstEdgeJudgments === null) a.firstEdgeJudgments = a.edgeJudgments.slice();
    if (a.firstCheck === null) a.firstCheck = a.check;
    a.checkAttempts++; a.checkedAt = Date.now();
    a.stage = E.sameResponse(q, a.final) && a.check === q.check.answer && edgeCheckOK ? 'done' : 'feedback';
    save(); render(); focusQuestion();
  }
  function focusQuestion() { $('#qtitle')?.focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'instant' }); }
  function bind() {
    const on = (id, fn) => { if ($('#' + id)) $('#' + id).onclick = fn; };
    document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => changeView(b.dataset.nav));
    document.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => start(+b.dataset.lesson));
    document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => start(state.lesson, +b.dataset.jump));
    document.querySelectorAll('[data-openq]').forEach(b => b.onclick = () => { const q = E.byId[b.dataset.openq]; start(q.lesson, E.LESSONS[q.lesson - 1].items.indexOf(q.id)); });
    document.querySelectorAll('[data-option]').forEach(b => b.onclick = () => {
      const q = qCurrent(), a = record(q), i = +b.dataset.option;
      if (q.main.kind === 'group') { const values = Array.isArray(a.draft) ? a.draft : []; if (values.includes(i)) a.draft = values.filter(x => x !== i); else if (values.length < 3) a.draft = values.concat(i); else { notify('已选三张；先取消一张再调整。'); return; } }
      else if (q.main.kind === 'repair') a.draft = { ...a.draft, repair: i };
      else a.draft = i;
      save(); render();
    });
    document.querySelectorAll('[data-position]').forEach(b => b.onclick = () => { const a = record(qCurrent()); a.draft = { ...a.draft, position: +b.dataset.position }; save(); render(); });
    document.querySelectorAll('[data-edge]').forEach(b => b.onclick = () => { const a = record(qCurrent()); a.edgeJudgments[+b.dataset.edge] = b.dataset.same === 'true'; save(); render(); });
    document.querySelectorAll('[data-check]').forEach(b => b.onclick = () => { record(qCurrent()).check = +b.dataset.check; save(); render(); });
    document.querySelectorAll('[data-bucket]').forEach(b => b.onclick = () => { bucket = b.dataset.bucket; render(); });
    document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const q = E.byId[b.dataset.sort], wanted = state.lesson === 2 ? E.TYPE[q.type].branch === '属性' ? 'a' : 'r' : q.type; if (bucket !== wanted) { notify('回想你比较的是特点还是联系，以及相同、不同或两者。'); return; } state.reviews[state.lesson] ??= {}; state.reviews[state.lesson][q.id] = true; save(); render(); });
    on('continue', () => start(state.lesson, state.index)); on('submit', submitMain); on('submitCheck', submitCheck);
    on('retry', () => { const a = record(qCurrent()); a.stage = 'answer'; a.check = null; save(); render(); focusQuestion(); });
    on('next', () => { if (!completed(qCurrent().id)) return; if (state.index < 11) start(state.lesson, state.index + 1); else changeView('review'); });
    on('nextLesson', () => state.lesson < 10 ? start(state.lesson + 1) : changeView('records'));
    on('hint', () => { const a = record(qCurrent()); a.hints = Math.min(3, a.hints + 1); save(); render(); });
    on('compare', () => { const a = record(qCurrent()); a.compareOpen = !a.compareOpen; if (a.compareOpen) a.usedCompare = true; save(); render(); });
    on('method', () => { const q = qCurrent(); $('#methodContent').innerHTML = `<h2>${esc(E.TYPE[q.type].name)}的方法依据</h2><p>${esc(q.source)}</p><p>${esc(q.explanation)}</p><p>${esc(q.checkExplanation)}</p><p>题目构造、检查任务与交互为本项目设计。原文解释操作机制，不提供此新实例。</p>`; $('#methodDialog').showModal(); });
    on('saveHtml', saveHtml); on('saveHtmlAbout', saveHtml); on('export', exportProgress); on('import', () => $('#importFile').click()); on('reset', () => $('#resetDialog').showModal());
    const setChange = (id, fn) => { if ($('#' + id)) $('#' + id).onchange = fn; };
    setChange('lessonSelect', e => start(+e.target.value)); setChange('reviewLesson', e => { state.lesson = +e.target.value; state.index = 0; save(); render(); }); setChange('reviewFilter', e => { reviewFilter = e.target.value; render(); });
    [['hypothesis', 'note'], ['inspect', 'inspect'], ['comparison', 'reflection']].forEach(([id, key]) => { if ($('#' + id)) $('#' + id).oninput = e => { record(qCurrent())[key] = e.target.value; save(); }; });
    setChange('importFile', async e => { const file = e.target.files[0]; if (!file) return; try { if (file.size > 2500000) throw Error('进度文件过大'); const data = validate(JSON.parse(await file.text())); state = data; save(); render(); notify('本版进度已导入。'); } catch (err) { notify('未导入：' + err.message); } });
  }
  $('#cancelReset').onclick = () => $('#resetDialog').close();
  $('#confirmReset').onclick = () => { state = initial(); save(); $('#resetDialog').close(); changeView('home'); };
  $('#closeMethod').onclick = () => $('#methodDialog').close();
  window.TrainingApp = { get state() { return E.clone(state); }, get view() { return view; }, get current() { return qCurrent(); }, start, changeView, validate, submitMain, submitCheck, render };
  render();
})();

</script>
</body></html>
